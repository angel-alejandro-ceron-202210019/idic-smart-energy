# Eclipse Mosquitto 2.x - IDIC Smart Energy
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883 0.0.0.0

# Parte 3 y 5: acceso anonimo para pruebas.
# En la Parte 6 se cambia a: allow_anonymous false + password_file
allow_anonymous true
