# Nginx: proxy inverso y balanceador de la API (IDIC Smart Energy)
worker_processes auto;
events { worker_connections 1024; }

http {
    # DNS interno de Docker: resuelve los nombres de servicio y reparte entre
    # las instancias cuando se escala (docker compose up -d --scale api=3)
    resolver 127.0.0.11 valid=5s ipv6=off;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        location = /health {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_set_header Host $host;
        }

        location /api/ {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location /monitor/ {
            set $mon http://monitor:8002;
            rewrite ^/monitor/(.*)$ /$1 break;
            proxy_pass $mon;
            proxy_set_header Host $host;
        }

        location / {
            set $web http://web:80;
            proxy_pass $web;
            proxy_set_header Host $host;
        }
    }
}
