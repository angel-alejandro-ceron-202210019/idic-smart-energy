# VM1 (srv-apps): Nginx, web, API REST, Mosquitto, procesamiento y monitoreo.
# Uso:    docker compose -f docker-compose.apps.yml up -d --build
# Escalar: docker compose -f docker-compose.apps.yml up -d --scale api=3
# Simulador (IoT): docker compose -f docker-compose.apps.yml --profile iot up -d simulator
name: idic

x-db-env: &db-env
  DB_HOST: ${DB_HOST:-10.10.20.12}
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-smart_energy}
  DB_USER: ${DB_USER:-energia_user}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "192.168.56.11:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - monitor
    networks: [idic-net]

  web:
    build: ./services/web
    image: ${DOCKERHUB_USER:-idic}/idic-web:${VERSION:-1.0}
    restart: unless-stopped
    networks: [idic-net]

  api:
    build: ./services/api
    image: ${DOCKERHUB_USER:-idic}/idic-api:${VERSION:-1.0}
    restart: unless-stopped
    environment:
      <<: *db-env
      API_KEY: ${API_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [idic-net]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "10.10.20.11:1883:1883"
      - "192.168.56.11:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [idic-net]

  processor:
    build: ./services/processor
    image: ${DOCKERHUB_USER:-idic}/idic-processor:${VERSION:-1.0}
    restart: unless-stopped
    environment:
      <<: *db-env
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    depends_on:
      mosquitto:
        condition: service_healthy
    expose:
      - "8001"
    networks: [idic-net]

  monitor:
    build: ./services/monitor
    image: ${DOCKERHUB_USER:-idic}/idic-monitor:${VERSION:-1.0}
    restart: unless-stopped
    environment:
      <<: *db-env
    expose:
      - "8002"
    networks: [idic-net]

  simulator:
    profiles: ["iot"]
    build: ./services/simulator
    image: ${DOCKERHUB_USER:-idic}/idic-simulator:${VERSION:-1.0}
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      INTERVALO_S: "2"
    depends_on:
      mosquitto:
        condition: service_healthy
    networks: [idic-net]

networks:
  idic-net:
    name: idic-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  mosquitto-data:
